name: Keep-alive API

# Render (plan free) apaga el servicio tras 15 min sin tráfico y la siguiente
# visita tarda ~40 s en despertarlo. Este workflow le hace un ping cada 10 min
# para que nunca llegue a dormirse y el catálogo cargue al instante.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    steps:
      - name: Despertar / mantener despierta la API
        run: |
          echo "Ping a $URL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 "$URL")
          echo "HTTP $code"
          test "$code" = "200"
        env:
          URL: https://luneby-api.onrender.com/api/health
