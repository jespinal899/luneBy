name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores de la misma rama / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Detecta qué parte del monorepo cambió para saltarse el job que no aplica.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filtrar por rutas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint:ci

      - name: Verificación de tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitarios (Jest)
        run: npm test -- --ci

      - name: Build de producción
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Verificación de tipos (tsc)
        run: npm run typecheck

      - name: Tests unitarios (Vitest)
        run: npm run test:run

      - name: Build de producción
        run: npm run build
        env:
          VITE_API_URL: https://luneby-api.onrender.com/api

  # ─────────────────────────────────────────────────────────────
  # Gate único para exigir en la protección de rama: pasa si ningún job
  # falló (un job saltado por paths-filter cuenta como OK).
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "cancelled" ] || \
             [ "${{ needs.frontend.result }}" = "cancelled" ]; then
            echo "::error::Algún job de CI falló"
            exit 1
          fi
          echo "Todo en orden."
