name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores de la misma rama / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Escaneo de secretos en el código y en TODO el historial de git.
  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Detecta qué parte del monorepo cambió para saltarse el job que no aplica.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filtrar por rutas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'supabase/migrations/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint:ci

      - name: Verificación de tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitarios (Jest)
        run: npm test -- --ci

      - name: Build de producción
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Análisis estático + cobertura en SonarCloud (proyecto público).
  sonarcloud:
    name: SonarCloud
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo, lo pide Sonar)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias (backend)
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias (frontend)
        working-directory: frontend
        run: npm ci

      - name: Generar cobertura del backend (Jest)
        working-directory: backend
        run: npx jest --coverage --coverageReporters=json-summary --coverageReporters=lcov

      - name: Generar cobertura del frontend (Vitest)
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Preparar coverage/ para Sonar (rutas relativas a la raíz)
        run: node scripts/prepare-coverage-for-sonar.mjs

      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Verificación de tipos (tsc)
        run: npm run typecheck

      - name: Tests unitarios (Vitest)
        run: npm run test:run

      - name: Build de producción
        run: npm run build
        env:
          VITE_API_URL: https://luneby-api.onrender.com/api

  # ─────────────────────────────────────────────────────────────
  # Integración: migraciones SQL + app real contra un Postgres real.
  # Verifica que las entidades de TypeORM coinciden con el esquema.
  backend_e2e:
    name: Backend e2e (Postgres real)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luneby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STAGE: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: luneby_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: e2e-secret
      JWT_EXPIRES_IN: 2h
      GOOGLE_CLIENT_ID: e2e-google-client-id
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Simular roles de Supabase (anon/authenticated/auth.uid)
        working-directory: .
        run: |
          psql -h localhost -U postgres -d luneby_test -v ON_ERROR_STOP=1 \
            -f "scripts/ci-simulate-supabase-roles.sql"

      - name: Aplicar migraciones SQL
        working-directory: .
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U postgres -d luneby_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Tests de integración (Jest e2e)
        run: npm run test:e2e

  # ─────────────────────────────────────────────────────────────
  # Gate único para exigir en la protección de rama: pasa si ningún job
  # falló (un job saltado por paths-filter cuenta como OK).
  ci-ok:
    name: CI OK
    if: always()
    needs: [secrets, changes, backend, backend_e2e, sonarcloud, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          echo "secrets:      ${{ needs.secrets.result }}"
          echo "changes:      ${{ needs.changes.result }}"
          echo "backend:      ${{ needs.backend.result }}"
          echo "backend_e2e:  ${{ needs.backend_e2e.result }}"
          echo "sonarcloud:   ${{ needs.sonarcloud.result }}"
          echo "frontend:     ${{ needs.frontend.result }}"
          if [ "${{ needs.secrets.result }}" != "success" ]; then
            echo "::error::El escaneo de secretos no pasó"
            exit 1
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::El job 'changes' no terminó bien"
            exit 1
          fi
          for r in "${{ needs.backend.result }}" \
                   "${{ needs.backend_e2e.result }}" \
                   "${{ needs.sonarcloud.result }}" \
                   "${{ needs.frontend.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Algún job de CI falló"
              exit 1
            fi
          done
          echo "Todo en orden."

  # ─────────────────────────────────────────────────────────────
  # Despliegue, encadenado al pipeline: `needs: ci-ok` hace que este job
  # solo arranque si el gate quedó en verde. Así un commit con los tests
  # en rojo no llega a producción.
  #
  # Los pasos se saltan solos (con un aviso, sin fallar) mientras falten
  # los secrets: eso permite tener esto en `main` sin romper nada durante
  # la transición, hasta que se apague el auto-deploy de Vercel y Render.
  deploy:
    name: Desplegar a producción
    needs: ci-ok
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Desplegar la API en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Falta el secret RENDER_DEPLOY_HOOK_URL: se omite el deploy de la API."
            exit 0
          fi
          curl -fsS "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy de la API disparado en Render."

      # Se corre desde la RAÍZ del repo, no desde `frontend/`: el proyecto
      # de Vercel tiene `frontend` configurado como Root Directory (por eso
      # `frontend/vercel.json` surte efecto), así que la CLI debe subir el
      # repo completo y dejar que Vercel aplique ese ajuste — igual que hace
      # hoy la integración de Git. Apuntar la CLI a `frontend/` haría que
      # buscara `frontend/frontend`.
      - name: Desplegar el frontend en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Faltan los secrets de Vercel: se omite el deploy del frontend."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
