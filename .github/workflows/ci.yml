name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores de la misma rama / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Escaneo de secretos en el código y en TODO el historial de git.
  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Detecta qué parte del monorepo cambió para saltarse el job que no aplica.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filtrar por rutas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'supabase/migrations/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint:ci

      - name: Verificación de tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitarios (Jest)
        run: npm test -- --ci

      - name: Build de producción
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Verificación de tipos (tsc)
        run: npm run typecheck

      - name: Tests unitarios (Vitest)
        run: npm run test:run

      - name: Build de producción
        run: npm run build
        env:
          VITE_API_URL: https://luneby-api.onrender.com/api

  # ─────────────────────────────────────────────────────────────
  # Integración: migraciones SQL + app real contra un Postgres real.
  # Verifica que las entidades de TypeORM coinciden con el esquema.
  backend_e2e:
    name: Backend e2e (Postgres real)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luneby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STAGE: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: luneby_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: e2e-secret
      JWT_EXPIRES_IN: 2h
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones SQL
        working-directory: .
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U postgres -d luneby_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Tests de integración (Jest e2e)
        run: npm run test:e2e

  # ─────────────────────────────────────────────────────────────
  # Gate único para exigir en la protección de rama: pasa si ningún job
  # falló (un job saltado por paths-filter cuenta como OK).
  ci-ok:
    name: CI OK
    if: always()
    needs: [secrets, changes, backend, backend_e2e, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          echo "secrets:      ${{ needs.secrets.result }}"
          echo "changes:      ${{ needs.changes.result }}"
          echo "backend:      ${{ needs.backend.result }}"
          echo "backend_e2e:  ${{ needs.backend_e2e.result }}"
          echo "frontend:     ${{ needs.frontend.result }}"
          if [ "${{ needs.secrets.result }}" != "success" ]; then
            echo "::error::El escaneo de secretos no pasó"
            exit 1
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::El job 'changes' no terminó bien"
            exit 1
          fi
          for r in "${{ needs.backend.result }}" \
                   "${{ needs.backend_e2e.result }}" \
                   "${{ needs.frontend.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Algún job de CI falló"
              exit 1
            fi
          done
          echo "Todo en orden."
