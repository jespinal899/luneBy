# Configuración de gitleaks para este repo.
# Extiende las reglas por defecto y solo agrega excepciones puntuales
# para falsos positivos conocidos — no se desactiva ninguna regla real.
title = "gitleaks config — luneBy"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos, no son secretos"
# El Project Key de SonarCloud es público (es la URL del proyecto en
# sonarcloud.io) y su forma "usuario_repo" dispara la regla genérica de
# "posible API key" por su entropía. No es un secreto.
regexes = ['''jespinal899_luneBy''']
paths = ['''sonar-project\.properties''']
