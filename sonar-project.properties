sonar.projectKey=jespinal899_luneBy
sonar.organization=jespinal899

# Monorepo: backend (NestJS) y frontend (React) como dos módulos de fuente.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
# `components/ui/**` son primitivas generadas por shadcn sobre base-ui: se
# regeneran con el CLI, así que corregirlas a mano se pierde en la siguiente
# actualización. Es código de terceros vendorizado, no propio.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,frontend/src/components/ui/**

# Reporte de cobertura del backend (Istanbul/lcov), ya commiteado en coverage/.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
