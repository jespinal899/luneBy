# Render Blueprint — va en la RAÍZ del repo (monorepo).
# Deploy: en Render → New + → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: luneby-api
    runtime: docker
    plan: free
    region: virginia # cerca de Supabase us-east-1
    rootDir: backend # el monorepo tiene la API en backend/
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/services
    autoDeploy: true
    envVars:
      - key: STAGE
        value: prod
      - key: PORT
        value: 3001
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_SECRET
        generateValue: true
      # Estas se rellenan a mano en Render al crear el Blueprint:
      - key: DATABASE_URL # Session pooler de Supabase:
        # postgresql://postgres.<ref>:<pwd>@aws-0-<region>.pooler.supabase.com:5432/postgres
        sync: false
      - key: FRONTEND_URL # https://<tu-front>.vercel.app
        sync: false
      - key: HOST_API # https://luneby-api.onrender.com/api
        sync: false
